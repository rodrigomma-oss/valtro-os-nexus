openapi: 3.1.0
info:
  title: Valtro OS API
  version: 1.0.0
  description: |
    Contrato público dos endpoints atualmente implementados na API v1 do Valtro OS.

    Neste momento, somente o endpoint de metadados está disponível no contrato
    público. O pipeline compartilhado de versionamento, request ID, erros e
    auditoria já atende esta rota. Endpoints de negócio permanecem planejados
    e não são anunciados como operacionais.

    O hostname definitivo da API ainda não foi homologado. O servidor hospedado
    abaixo representa o ambiente atual da aplicação, não um domínio definitivo
    para integrações de produção.
  contact:
    name: Valtro Labs Platform Team
    email: platform@valtrolabs.pro

servers:
  - url: https://valtro-vision-forge.lovable.app/api/v1
    description: Ambiente hospedado atual; hostname definitivo da API pendente de homologação.
  - url: http://localhost:8080/api/v1
    description: Ambiente de desenvolvimento local.

tags:
  - name: Sistema
    description: Metadados e ciclo de vida da API.

paths:
  /meta:
    get:
      operationId: getApiMeta
      tags:
        - Sistema
      summary: Consultar metadados da API
      description: |
        Retorna a versão v1 e seu estado de ciclo de vida. O controle de
        disponibilidade é aplicado pelo pipeline compartilhado das rotas v1.
      x-valtro-implementation-status: implemented
      responses:
        "200":
          description: Metadados retornados com sucesso.
          headers:
            X-Valtro-API-Version:
              $ref: "#/components/headers/ApiVersion"
            X-Valtro-Request-ID:
              $ref: "#/components/headers/RequestId"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
        "404":
          description: Os metadados da versão v1 não estão disponíveis.
          headers:
            X-Valtro-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Ocorreu um erro interno sem exposição de detalhes sensíveis.
          headers:
            X-Valtro-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A versão v1 está desabilitada ou sua data de sunset passou.
          headers:
            X-Valtro-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  headers:
    ApiVersion:
      description: Versão que processou a requisição.
      schema:
        type: string
        example: v1
    RequestId:
      description: Identificador de rastreio gerado pelo Valtro OS.
      schema:
        $ref: "#/components/schemas/RequestId"
    Deprecation:
      description: Data de depreciação, presente quando configurada.
      schema:
        type: string
        format: http-date
    Sunset:
      description: Data de desligamento, presente quando configurada.
      schema:
        type: string
        format: http-date

  schemas:
    RequestId:
      type: string
      pattern: "^req_[a-f0-9]{16}$"
      example: req_a1b2c3d4e5f60708

    MetaData:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          example: v1
        status:
          type: string
          enum: [development, stable, deprecated, sunset, disabled]
        deprecated:
          type: boolean
        releasedAt:
          type: [string, "null"]
          format: date-time
        deprecationAt:
          type: [string, "null"]
          format: date-time
        sunsetAt:
          type: [string, "null"]
          format: date-time
        replacementVersion:
          type: [string, "null"]
          format: uuid
      required:
        - version
        - status
        - deprecated
        - releasedAt
        - deprecationAt
        - sunsetAt
        - replacementVersion

    MetaResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/MetaData"
        requestId:
          $ref: "#/components/schemas/RequestId"
      required:
        - success
        - data
        - requestId

    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - VERSION_UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
      required:
        - code
        - message

    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        requestId:
          $ref: "#/components/schemas/RequestId"
      required:
        - success
        - error
        - requestId

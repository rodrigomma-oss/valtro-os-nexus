openapi: 3.1.0
info:
  title: API Plataforma Valtro Labs
  description: API oficial para integração de aplicações do ecossistema Valtro Labs.
  version: 1.0.0
servers:
  - url: https://api.valtrolabs.pro
    description: Produção

components:
  securitySchemes:
    HmacAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Padrão VALTRO-HMAC-SHA256-V1

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }

    BugCreateRequest:
      type: object
      required: [external_reference, actor, title, description, category]
      properties:
        external_reference: { type: string, format: uuid }
        actor:
          type: object
          required: [source, external_user_id]
          properties:
            source: { type: string, enum: [valtro-pricing] }
            external_user_id: { type: string, format: uuid }
        contact:
          type: object
          properties:
            name: { type: string }
            email: { type: string, format: email }
        title: { type: string, minLength: 5 }
        description: { type: string, minLength: 10 }
        category: { type: string, enum: [calculator, products, promotions, login, signup, mobile, other] }

    FeedbackCreateRequest:
      type: object
      required: [external_reference, actor, title, description, category]
      properties:
        external_reference: { type: string, format: uuid }
        actor:
          type: object
          required: [source, external_user_id]
          properties:
            source: { type: string, enum: [valtro-pricing] }
            external_user_id: { type: string, format: uuid }
        contact:
          type: object
          properties:
            name: { type: string }
            email: { type: string, format: email }
        title: { type: string, minLength: 5 }
        description: { type: string, minLength: 10 }
        category: { type: string, enum: [feature, ui_improvement, reports, calculator, products, promotions, other] }
        context:
          type: object
          properties:
            plan: { type: string }
            app_version: { type: string }

paths:
  /api/v1/bugs:
    post:
      summary: Reportar um bug
      security: [{ HmacAuth: ["support:bugs:create"] }]
      parameters:
        - in: header
          name: x-idempotency-key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BugCreateRequest' }
      responses:
        '201': { description: Criado }
        '200': { description: Replay Idempotente }

  /api/v1/feedback:
    post:
      summary: Enviar feedback
      security: [{ HmacAuth: ["support:feedback:create"] }]
      parameters:
        - in: header
          name: x-idempotency-key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackCreateRequest' }
      responses:
        '201': { description: Criado }
        '200': { description: Replay Idempotente }

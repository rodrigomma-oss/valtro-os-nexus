name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E (bun run test:e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Supabase (públicos — seguros como Variables)
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ezngjargedpcvxnyrgyq.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'ezngjargedpcvxnyrgyq' }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ezngjargedpcvxnyrgyq.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Alvo do teste (lead permanente do CRM)
      TEST_LEAD_ID: ${{ vars.TEST_LEAD_ID }}

      # Credenciais do usuário E2E dedicado (role operator, sem privilégios admin).
      # Login fresco a cada execução — NUNCA impressos em logs.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      PLAYWRIGHT_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start dev server
        run: bun run dev &
        env:
          PORT: "8080"

      - name: Wait for dev server
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:8080 >/dev/null; then
              echo "Dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "Dev server did not start" >&2
          exit 1

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Exclui o storageState (contém tokens) do artefato.
          path: |
            playwright-report/
            test-results/
            !**/.auth/**
          retention-days: 7

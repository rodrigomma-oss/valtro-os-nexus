name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E (bun run test:e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Supabase (public, safe values already committed in .env)
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ezngjargedpcvxnyrgyq.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'ezngjargedpcvxnyrgyq' }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ezngjargedpcvxnyrgyq.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Test target (existing lead uuid in the CRM)
      TEST_LEAD_ID: ${{ vars.TEST_LEAD_ID }}

      # Dedicated CI test-session secret — a full Supabase session JSON for a
      # non-privileged test user. Managed exclusively via GitHub Actions Secrets;
      # never commit or echo this value.
      LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
      LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}
      LOVABLE_BROWSER_SUPABASE_COOKIES_JSON: ${{ secrets.E2E_SUPABASE_COOKIES_JSON }}

      PLAYWRIGHT_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start dev server
        run: bun run dev &
        env:
          PORT: "8080"

      - name: Wait for dev server
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:8080 >/dev/null; then
              echo "Dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "Dev server did not start" >&2
          exit 1

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
